<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #3B82F6;
    --sky-bright: #60A5FA;
    --sky-deep: #1D4ED8;
    --sky-soft: #DBEAFE;
    --sun: #FBBF24;
    --sun-deep: #D97706;
    --sun-soft: #FEF3C7;
    --leaf: #22C55E;
    --leaf-soft: #DCFCE7;
    --leaf-deep: #16A34A;
    --coral: #F87171;
    --coral-soft: #FEE2E2;
    --coral-deep: #B91C1C;
    --berry-soft: #F3E8FF;
    --berry-deep: #7E22CE;
    --bg: #FFFFFF;
    --surface: #F8FAFC;
    --surface-elevated: #FFFFFF;
    --surface-sunken: #F1F5F9;
    --ink: #0F172A;
    --ink-muted: #475569;
    --ink-subtle: #94A3B8;
    --outline: #E2E8F0;
    --font-display: 'Nunito', 'Quicksand', sans-serif;
    --font-body: 'Atkinson Hyperlegible', 'Nunito Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.5;
    letter-spacing: 0.01em;
    display: flex;
    justify-content: center;
    padding: 40px 20px 64px;
  }

  .wrap { width: 100%; max-width: 860px; }

  header h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 36px;
    line-height: 44px;
    margin: 0 0 6px;
  }

  header p {
    margin: 0 0 28px;
    color: var(--ink-muted);
    font-size: 18px;
  }

  .stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .stat-card {
    flex: 1;
    min-width: 200px;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 20px;
    padding: 20px 24px;
  }

  .stat-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-muted);
    margin: 0 0 6px;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--ink);
    margin: 0;
  }

  #statTotal { font-size: 40px; line-height: 1; }
  #statCount { font-size: 28px; line-height: 1; }

  .breakdown {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 32px;
  }

  .cat-chip {
    display: inline-flex;
    align-items: center;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }

  .card {
    background: var(--surface-elevated);
    border: 1px solid var(--outline);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 28px;
  }

  .card h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 18px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    align-items: end;
  }

  .field label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }

  .field select,
  .field input {
    width: 100%;
    padding: 14px 16px;
    font-size: 17px;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 12px;
  }

  .field select:focus,
  .field input:focus {
    outline: none;
    border-color: var(--sky);
    box-shadow: 0 0 0 4px var(--sky-soft);
  }

  .amount-wrap { position: relative; }

  .amount-wrap input { padding-right: 36px; }

  .stepper {
    position: absolute;
    top: 1px;
    right: 1px;
    bottom: 1px;
    width: 30px;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--outline);
    border-radius: 0 11px 11px 0;
    overflow: hidden;
  }

  .step-btn {
    flex: 1;
    border: none;
    background: var(--surface);
    color: var(--ink-subtle);
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }

  .step-btn:hover { background: var(--sky-soft); color: var(--sky-deep); }
  .step-btn:active { background: var(--sky-soft); }
  .step-btn:first-child { border-bottom: 1px solid var(--outline); }

  .month-total {
    margin: 18px 0 0;
    font-size: 18px;
    color: var(--ink);
  }

  .month-total .amt {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--sky-deep);
  }

  .form-error {
    display: none;
    grid-column: 1 / -1;
    color: var(--coral-deep);
    background: var(--coral-soft);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
  }

  .btn-primary {
    min-height: 56px;
    padding: 14px 32px;
    border: none;
    border-radius: 16px;
    background: var(--sky);
    color: #fff;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease;
  }

  .btn-primary:hover { background: var(--sky-deep); box-shadow: inset 0 -3px 0 var(--sky-bright); }
  .btn-primary:active { transform: scale(0.97); }

  .btn-secondary {
    min-height: 56px;
    padding: 14px 28px;
    border: 1px solid var(--outline);
    border-radius: 16px;
    background: #fff;
    color: var(--ink-muted);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
  }

  .btn-secondary:hover { background: var(--surface-sunken); color: var(--ink); }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 14px;
  }

  .filter-pills { display: flex; flex-wrap: wrap; gap: 8px; }

  .pill-btn {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--outline);
    background: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: var(--font-body);
    color: var(--ink-muted);
    cursor: pointer;
  }

  .pill-btn.active {
    background: var(--sky);
    border-color: var(--sky);
    color: #fff;
  }

  .sort-controls { display: flex; align-items: center; gap: 8px; }

  .sort-controls select {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--outline);
    font-size: 14px;
    font-family: var(--font-body);
    background: #fff;
    color: var(--ink);
  }

  .dir-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--outline);
    background: #fff;
    font-size: 16px;
    color: var(--ink-muted);
    cursor: pointer;
  }

  .list-card {
    background: var(--surface-elevated);
    border: 1px solid var(--outline);
    border-radius: 20px;
    overflow: hidden;
  }

  .row {
    display: grid;
    grid-template-columns: 116px 1fr 108px 90px 32px 32px;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--outline);
  }

  .row:last-child { border-bottom: none; }

  .row-tag {
    justify-self: start;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }

  .row-name { font-size: 16px; font-weight: 600; color: var(--ink); }
  .row-date { font-size: 14px; color: var(--ink-subtle); }

  .row-value {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    text-align: right;
  }

  .row-edit,
  .row-delete {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--ink-subtle);
    font-size: 15px;
    cursor: pointer;
    line-height: 1;
  }

  .row-edit:hover { background: var(--sky-soft); color: var(--sky-deep); }
  .row-delete:hover { background: var(--coral-soft); color: var(--coral-deep); }

  .conn-error {
    color: var(--coral-deep);
    background: var(--coral-soft);
    border-radius: 12px;
    padding: 14px 18px;
    font-weight: 700;
    margin: 0 0 20px;
  }

  .empty-state {
    display: none;
    padding: 44px 20px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 16px;
  }

  @media (max-width: 620px) {
    .row { grid-template-columns: 88px 1fr 68px 30px 30px; }
    .row-date { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Expense tracker</h1>
    <p>See where your money's going, one entry at a time.</p>
  </header>

  <p class="conn-error" id="connError" style="display:none;">Can't reach the server. Make sure it's running, then reload the page.</p>

  <div class="stats">
    <div class="stat-card">
      <p class="stat-label">Total spent</p>
      <p class="stat-value" id="statTotal">$0.00</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Expenses logged</p>
      <p class="stat-value" id="statCount">0</p>
    </div>
  </div>

  <div class="breakdown" id="breakdown"></div>

  <div class="card">
    <h2>Spending by month</h2>
    <div class="form-grid">
      <div class="field">
        <label for="monthSelect">Month</label>
        <select id="monthSelect">
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9" selected>September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
      </div>
      <div class="field">
        <label for="yearSelect">Year</label>
        <select id="yearSelect">
          <option value="2023">2023</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026" selected>2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
        </select>
      </div>
    </div>
    <p class="month-total"><span id="monthLabel">September 2026</span> total: <span class="amt" id="monthAmt">$0.00</span></p>
  </div>

  <div class="card">
    <h2 id="formTitle">Add an expense</h2>
    <form id="expenseForm">
      <div class="form-grid">
        <div class="field">
          <label for="fCategory">Category</label>
          <select id="fCategory" required>
            <option value="" disabled selected>Choose one</option>
          </select>
        </div>
        <div class="field">
          <label for="fName">Name</label>
          <input id="fName" type="text" placeholder="What was it for?">
        </div>
        <div class="field">
          <label for="fValue">Amount</label>
          <div class="amount-wrap">
            <input id="fValue" type="text" inputmode="decimal" placeholder="0.00">
            <div class="stepper">
              <button type="button" class="step-btn" id="stepUp" aria-label="Increase amount">&#9650;</button>
              <button type="button" class="step-btn" id="stepDown" aria-label="Decrease amount">&#9660;</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="fDate">Date</label>
          <input id="fDate" type="text" inputmode="numeric" placeholder="YYYY-MM-DD">
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Add expense</button>
        <button type="button" class="btn-secondary" id="cancelEditBtn" style="display:none;">Cancel</button>
        <p class="form-error" id="formError"></p>
      </div>
    </form>
  </div>

  <div class="controls">
    <div class="filter-pills" id="filterPills"></div>
    <div class="sort-controls">
      <label for="sortSelect" style="font-size:14px;color:var(--ink-muted);">Sort by</label>
      <select id="sortSelect">
        <option value="date">Date</option>
        <option value="value">Amount</option>
        <option value="name">Name</option>
      </select>
      <button type="button" class="dir-btn" id="sortDirBtn" aria-label="Toggle sort direction">↓</button>
    </div>
  </div>

  <div class="list-card">
    <div id="list"></div>
    <p class="empty-state" id="emptyState">Nothing here yet — add an expense to get started!</p>
  </div>
</div>

<script>
  // Empty string = same origin as the page (this file is now served by FastAPI
  // itself, so no cross-origin requests or CORS config are needed). If this
  // page is ever opened a different way, set this to the API's full URL.
  const API_BASE = '';

  // Populated from GET /categories at startup so the category list has one
  // source of truth (the backend's CATEGORIES) instead of being duplicated here.
  let CATS = [];

  const CAT_COLORS = {
    Food:          { bg: 'var(--sun-soft)',    text: 'var(--sun-deep)' },
    Transport:     { bg: 'var(--sky-soft)',    text: 'var(--sky-deep)' },
    Entertainment: { bg: 'var(--berry-soft)',  text: 'var(--berry-deep)' },
    Education:     { bg: 'var(--leaf-soft)',   text: 'var(--leaf-deep)' },
    Bills:         { bg: 'var(--surface-sunken)', text: 'var(--ink-muted)' },
    Other:         { bg: 'var(--surface-sunken)', text: 'var(--ink-subtle)' }
  };
  const DEFAULT_CAT_COLOR = { bg: 'var(--surface-sunken)', text: 'var(--ink-subtle)' };
  function colorFor(category) { return CAT_COLORS[category] || DEFAULT_CAT_COLOR; }

  let expenses = [];
  let filterCat = 'All';
  let sortBy = 'date';
  let sortDir = 'desc';

async function loadExpenses() {
    const response = await fetch(`${API_BASE}/expenses`);
    if (!response.ok) throw new Error('Failed to load expenses');

    const data = await response.json();

    expenses = data.map(e => ({
        ...e,
        valueCents: centsFromDecimalStr(e.value),
        date: new Date(e.date)
    }));
}

  // Money is kept as integer cents everywhere in JS to avoid float rounding
  // errors when summing many values. The server sends/accepts exact decimal
  // strings (e.g. "12.50"); we only ever divide by 100 at the final display
  // step, never accumulate divided/float values.
  function centsFromDecimalStr(s) {
    const str = String(s).trim();
    const negative = str.startsWith('-');
    const unsigned = negative ? str.slice(1) : str;
    const [whole, frac = ''] = unsigned.split('.');
    const fracPadded = (frac + '00').slice(0, 2);
    const cents = (parseInt(whole || '0', 10) * 100) + parseInt(fracPadded, 10);
    return negative ? -cents : cents;
  }

  function fmtMoneyCents(cents) { return '$' + (cents / 100).toFixed(2); }

  async function loadCategories() {
    const response = await fetch(`${API_BASE}/categories`);
    if (!response.ok) throw new Error('Failed to load categories');
    CATS = await response.json();
    const select = document.getElementById('fCategory');
    CATS.forEach(c => {
      const option = document.createElement('option');
      option.value = c;
      option.textContent = c;
      select.appendChild(option);
    });
  }

  function fmtDate(date) {
    const d = date instanceof Date ? date : new Date(date);
    return d.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
    });
}

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function isValidAmountStr(s) {
    return /^[0-9]+(\.[0-9]+)?$/.test(s) && parseFloat(s) > 0;
  }

  function isValidDateStr(str) {
    return /^\d{4}-\d{2}-\d{2}$/.test(str);
}

  function toLocalDateTimeString(date) {
      const pad = n => String(n).padStart(2, '0');

      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
  }

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function computeTotals() {
    let totalCents = 0;
    const byCatCents = {};
    CATS.forEach(c => byCatCents[c] = 0);
    expenses.forEach(e => { totalCents += e.valueCents; byCatCents[e.category] += e.valueCents; });
    return { totalCents, byCatCents };
  }

  function renderMonthTotal() {
    const month = parseInt(document.getElementById('monthSelect').value, 10);
    const year = parseInt(document.getElementById('yearSelect').value, 10);
    let totalCents = 0;
    expenses.forEach(e => {
      const d = e.date instanceof Date ? e.date : new Date(e.date);
      if (d.getMonth() + 1 === month && d.getFullYear() === year) totalCents += e.valueCents;
    });
    document.getElementById('monthLabel').textContent = MONTH_NAMES[month - 1] + ' ' + year;
    document.getElementById('monthAmt').textContent = fmtMoneyCents(totalCents);
  }

  function renderStats() {
    const { totalCents, byCatCents } = computeTotals();
    document.getElementById('statTotal').textContent = fmtMoneyCents(totalCents);
    document.getElementById('statCount').textContent = String(expenses.length);

    const breakdown = document.getElementById('breakdown');
    breakdown.innerHTML = '';
    CATS.forEach(c => {
      if (byCatCents[c] <= 0) return;
      const chip = document.createElement('span');
      chip.className = 'cat-chip';
      chip.style.background = colorFor(c).bg;
      chip.style.color = colorFor(c).text;
      chip.textContent = c + ' \u00b7 ' + fmtMoneyCents(byCatCents[c]);
      breakdown.appendChild(chip);
    });

    renderMonthTotal();
  }

  function renderFilterPills() {
    const wrap = document.getElementById('filterPills');
    wrap.innerHTML = '';
    ['All', ...CATS].forEach(c => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pill-btn' + (filterCat === c ? ' active' : '');
      btn.textContent = c;
      btn.addEventListener('click', () => {
        filterCat = c;
        renderFilterPills();
        renderList();
      });
      wrap.appendChild(btn);
    });
  }

  function renderList() {
    let list = filterCat === 'All' ? expenses.slice() : expenses.filter(e => e.category === filterCat);
    list.sort((a, b) => {
      let r = 0;
      if (sortBy === 'date') r = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      else if (sortBy === 'value') r = a.valueCents - b.valueCents;
      else r = a.name.localeCompare(b.name);
      return sortDir === 'asc' ? r : -r;
    });

    const container = document.getElementById('list');
    const empty = document.getElementById('emptyState');
    container.innerHTML = '';

    if (list.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    list.forEach(e => {
      const colors = colorFor(e.category);
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<span class="row-tag" style="background:' + colors.bg + ';color:' + colors.text + ';">' + e.category + '</span>' +
        '<span class="row-name">' + escapeHtml(e.name) + '</span>' +
        '<span class="row-date">' + fmtDate(e.date) + '</span>' +
        '<span class="row-value">' + fmtMoneyCents(e.valueCents) + '</span>' +
        '<button class="row-edit" aria-label="Edit ' + escapeHtml(e.name) + '" data-id="' + e.id + '">\u270e</button>' +
        '<button class="row-delete" aria-label="Delete ' + escapeHtml(e.name) + '" data-id="' + e.id + '">\u00d7</button>';
      container.appendChild(row);
    });
  }

  document.getElementById('list').addEventListener('click', async (ev) => {
    const editBtn = ev.target.closest('.row-edit');
    if (editBtn) {
      const expense = expenses.find(e => e.id === Number(editBtn.dataset.id));
      if (expense) enterEditMode(expense);
      return;
    }

    const delBtn = ev.target.closest('.row-delete');
    if (!delBtn) return;
    const id = Number(delBtn.dataset.id);
    const expense = expenses.find(e => e.id === id);
    if (!expense) return;
    if (!confirm('Delete "' + expense.name + '" (' + fmtMoneyCents(expense.valueCents) + ')? This can\'t be undone.')) return;
    
    let response;
    try {
        response = await fetch(`${API_BASE}/expenses/${id}`, { method: "DELETE" });
    } catch (err) {
        alert("Can't reach the server. Check your connection and try again.");
        return;
    }

    if (!response.ok) {
        alert("Failed to delete expense.");
        return;
    }
    expenses = expenses.filter(e => e.id !== id);
    if (editingId === id) exitEditMode();
    renderStats();
    renderList();
  });

  document.getElementById('sortSelect').addEventListener('change', (ev) => {
    sortBy = ev.target.value;
    renderList();
  });

  document.getElementById('sortDirBtn').addEventListener('click', () => {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    document.getElementById('sortDirBtn').textContent = sortDir === 'asc' ? '\u2191' : '\u2193';
    renderList();
  });

  document.getElementById('monthSelect').addEventListener('change', renderMonthTotal);
  document.getElementById('yearSelect').addEventListener('change', renderMonthTotal);

  const AMOUNT_STEP = 0.01;
  const valueInputEl = document.getElementById('fValue');
  let stepTimer = null;
  let stepHeld = false;

  function bumpAmount(delta) {
    const raw = valueInputEl.value.trim();
    const current = isValidAmountStr(raw) ? parseFloat(raw) : 0;
    let next = Math.round((current + delta) * 100) / 100;
    if (next < 0) next = 0;
    valueInputEl.value = next.toFixed(2);
  }

  function startHold(delta) {
    stepHeld = false;
    clearTimeout(stepTimer);
    stepTimer = setTimeout(function repeat() {
      stepHeld = true;
      bumpAmount(delta);
      stepTimer = setTimeout(repeat, 70);
    }, 350);
  }

  function stopHold() {
    clearTimeout(stepTimer);
    stepTimer = null;
  }

  function wireStepper(id, delta) {
    const btn = document.getElementById(id);
    btn.addEventListener('pointerdown', () => startHold(delta));
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => btn.addEventListener(evt, stopHold));
    btn.addEventListener('click', () => {
      if (!stepHeld) bumpAmount(delta);
      stepHeld = false;
    });
  }

  wireStepper('stepUp', AMOUNT_STEP);
  wireStepper('stepDown', -AMOUNT_STEP);

  let editingId = null;
  let editingOriginalDate = null;

  function enterEditMode(expense) {
    editingId = expense.id;
    editingOriginalDate = expense.date;
    document.getElementById('fCategory').value = expense.category;
    document.getElementById('fName').value = expense.name;
    document.getElementById('fValue').value = (expense.valueCents / 100).toFixed(2);
    document.getElementById('fDate').value =
    toLocalDateTimeString(expense.date).slice(0, 10);
    document.getElementById('formTitle').textContent = 'Edit expense';
    document.getElementById('submitBtn').textContent = 'Save changes';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    document.getElementById('formError').style.display = 'none';
    document.getElementById('expenseForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function exitEditMode() {
    editingId = null;
    editingOriginalDate = null;
    document.getElementById('expenseForm').reset();
    document.getElementById('fDate').value =
    toLocalDateTimeString(new Date()).slice(0, 10);
    document.getElementById('formTitle').textContent = 'Add an expense';
    document.getElementById('submitBtn').textContent = 'Add expense';
    document.getElementById('cancelEditBtn').style.display = 'none';
    document.getElementById('formError').style.display = 'none';
  }

  document.getElementById('cancelEditBtn').addEventListener('click', exitEditMode);

  document.getElementById('expenseForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const catSelect = document.getElementById('fCategory');
    const nameInput = document.getElementById('fName');
    const valueInput = document.getElementById('fValue');
    const dateInput = document.getElementById('fDate');
    const errorEl = document.getElementById('formError');

    const category = catSelect.value;
    let name = nameInput.value.trim();
    const rawValue = valueInput.value.trim();
    const rawDate = dateInput.value;

    if (!category) {
      errorEl.textContent = 'Choose a category first.';
      errorEl.style.display = 'block';
      return;
    }
    if (!isValidAmountStr(rawValue)) {
      errorEl.textContent = 'Enter an amount using digits, e.g. 12.50';
      errorEl.style.display = 'block';
      return;
    }
    if (rawDate !== '' && !isValidDateStr(rawDate)) {
      errorEl.textContent = 'Enter the date as YYYY-MM-DD, e.g. 2026-09-06';
      errorEl.style.display = 'block';
      return;
    }
    errorEl.style.display = 'none';

    if (name === '') name = category;
    let date;
    if (rawDate !== '' && editingId !== null && editingOriginalDate) {
      // Editing: keep the original time-of-day so same-day sort order
      // (which relies on stored time) doesn't get disturbed just because
      // the date field displays date-only.
      const [y, m, d] = rawDate.split('-').map(Number);
      date = new Date(editingOriginalDate);
      date.setFullYear(y, m - 1, d);
    } else if (rawDate !== '') {
      date = new Date(rawDate + 'T00:00:00');
    } else {
      date = new Date();
    }

    if (editingId !== null) {
    let response;
    try {
        response = await fetch(
            `${API_BASE}/expenses/${editingId}`,
            {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    category: category,
                    name: name,
                    value: rawValue,
                    date: toLocalDateTimeString(date)
                })
            }
        );
    } catch (err) {
        errorEl.textContent = "Can't reach the server. Check your connection and try again.";
        errorEl.style.display = "block";
        return;
    }

    if (!response.ok) {
        errorEl.textContent = "Failed to update expense.";
        errorEl.style.display = "block";
        return;
    }

    const updatedExpense = await response.json();

    const index = expenses.findIndex(e => e.id === editingId);

    if (index !== -1) {
        expenses[index] = {
            ...updatedExpense,
            valueCents: centsFromDecimalStr(updatedExpense.value),
            date: new Date(updatedExpense.date)
        };
    }

    exitEditMode();
} else {
    let response;
    try {
        response = await fetch(`${API_BASE}/expenses`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                category: category,
                name: name,
                value: rawValue,
                date: toLocalDateTimeString(date)
            })
        });
    } catch (err) {
        errorEl.textContent = "Can't reach the server. Check your connection and try again.";
        errorEl.style.display = "block";
        return;
    }

    if (!response.ok) {
        errorEl.textContent = "Failed to add expense.";
        errorEl.style.display = "block";
        return;
    }

    const createdExpense = await response.json();

    expenses.push({
        ...createdExpense,
        valueCents: centsFromDecimalStr(createdExpense.value),
        date: new Date(createdExpense.date)
    });

    ev.target.reset();

    document.getElementById('fDate').value =
    toLocalDateTimeString(new Date()).slice(0, 10);
}
    renderStats();
    renderList();
  });

async function init() {
    try {
        await loadCategories();
        await loadExpenses();
    } catch (err) {
        document.getElementById('connError').style.display = 'block';
        return;
    }
    document.getElementById('connError').style.display = 'none';
    document.getElementById('fDate').value =
    toLocalDateTimeString(new Date()).slice(0, 10);
    renderStats();
    renderFilterPills();
    renderList();
}

init();
</script>
</body>
</html>
